<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11100f"><meta name="robots" content="noindex,nofollow,noarchive">
<title>Salon White · Görsel Yönetimi</title>
<style>
:root{--bg:#0f0f0e;--card:rgba(255,255,255,.075);--line:rgba(255,255,255,.14);--text:#f7f4ee;--muted:#aaa49a;--gold:#c8a77d;--ok:#9fd5a5;--bad:#e9a0a0;--blue:#a9c8e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% 0,rgba(200,167,125,.14),transparent 65%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1180px,92vw);margin:auto;padding:24px 0 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:46px;height:46px;border-radius:13px}.brand b{display:block;font-size:13px;letter-spacing:.15em}.brand small{color:var(--muted);font-size:9px;letter-spacing:.12em}.btn{border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--text);background:var(--card);font-size:11px;cursor:pointer}.btn.primary{background:#f7f4ee;color:#151412;border-color:#f7f4ee;font-weight:700}.back{text-decoration:none;color:inherit}
.hero h1{font:500 clamp(42px,7vw,76px)/.9 Georgia,serif;letter-spacing:-.055em;margin:0 0 14px}.hero h1 em{font-weight:400}.lead{max-width:720px;color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 28px}
.connection{display:flex;align-items:center;gap:9px;padding:12px 15px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04);font-size:11px;margin-bottom:34px}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.section{margin:42px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:15px}.section-kicker{font-size:9px;letter-spacing:.2em;color:var(--gold);margin-bottom:5px}.section h2{font-size:25px;margin:0}.section-desc{color:var(--muted);font-size:11px;margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:25px;padding:14px}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.num{font-size:9px;letter-spacing:.2em;color:var(--gold)}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 8px}.card h3{font-size:15px;margin:5px 0 4px}.path{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{height:190px;margin:12px 0;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.22);overflow:hidden;display:flex;align-items:center;justify-content:center}.preview img{display:none;width:100%;height:100%;object-fit:cover}.preview.has img{display:block}.empty{font-size:9px;color:var(--muted)}.preview.has .empty{display:none}.file{display:none}.pick{display:flex;align-items:center;justify-content:center;min-height:52px;border:1px dashed rgba(255,255,255,.28);border-radius:15px;background:rgba(255,255,255,.035);font-size:11px;font-weight:600;cursor:pointer}.selected{font-size:9px;color:var(--muted);min-height:16px;margin:8px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upload{width:100%;min-height:46px}.status{font-size:10px;line-height:1.45;min-height:30px;margin-top:9px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.04);color:var(--muted)}.status.ok{color:var(--ok);background:rgba(159,213,165,.08)}.status.bad{color:var(--bad);background:rgba(233,160,160,.08)}.status.busy{color:var(--blue)}.busy{opacity:.65;pointer-events:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:min(90vw,520px);padding:13px 17px;border-radius:16px;background:#252321;border:1px solid var(--line);font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{width:94vw}.top{align-items:flex-start}.grid{grid-template-columns:1fr}.preview{height:215px}}
</style></head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><img src="assets/logo/salon-white-logo.png" alt="Salon White"><div><b>SALON WHITE</b><small>SİRKECİ · GÖRSEL YÖNETİMİ</small></div></div><a class="back" href="./">← Siteye dön</a></header>
<main><div class="hero"><h1>Görselleri<br><em>kolayca yönet.</em></h1><p class="lead">Tüm site görselleri tek kaynak olan image-slots.js üzerinden yönetilir. Seç, önizle ve GitHub'a yükle.</p><div class="connection"><span id="dot" class="dot"></span><span id="conn">Bağlantı kontrol ediliyor…</span></div></div><div id="sections"></div></main>
</div><div id="toast" class="toast"></div>
<script src="image-slots.js?v=20260928-qa"></script>
<script>
const A=window.SALON_IMAGE_SLOTS||[], $=s=>document.querySelector(s), authKey="salonWhiteAdminAuth";
let adminAuth=sessionStorage.getItem(authKey)||"";
function toast(t){const x=$("#toast");x.textContent=t;x.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove("show"),2800)}
async function api(u,o={},retry=true){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),o.timeout||10000);
 try{
  const headers=new Headers(o.headers||{});if(adminAuth)headers.set("Authorization","Basic "+adminAuth);
  let r=await fetch(u,{...o,headers,signal:controller.signal,cache:"no-store",credentials:"same-origin"});
  if(r.status===401&&retry&&!u.startsWith("/api/health")){
   const user=prompt("Salon White Admin kullanıcı adı:","admin");if(user===null)return r;
   const pass=prompt("Salon White Admin şifresi:");if(pass===null)return r;
   adminAuth=btoa(unescape(encodeURIComponent(user+":"+pass)));sessionStorage.setItem(authKey,adminAuth);
   r=await api(u,o,false);
  } return r;
 }finally{clearTimeout(timer)}
}
function setStatus(i,msg,kind){const e=$("#st"+i);if(!e)return;e.textContent=msg;e.className="status"+(kind?" "+kind:"")}
function card(slot,i){
 return '<article class="card" data-card="'+i+'"><div class="card-top"><span class="num">'+slot.id+'</span><span class="tag">'+slot.section+'</span></div><h3>'+slot.label+'</h3><div class="path">assets/images/'+slot.file+'</div><div class="preview" id="p'+i+'"><img id="im'+i+'" alt="'+slot.label+'"><span class="empty">GÖRSEL YOK</span></div><label class="pick"><input id="f'+i+'" class="file" type="file" accept="image/png,image/jpeg,image/webp,image/avif">＋ Fotoğraf seç</label><div id="sel'+i+'" class="selected">Fotoğraf seçilmedi.</div><button class="btn primary upload" data-u="'+i+'">Fotoğrafı Yükle / Değiştir</button><div id="st'+i+'" class="status">Hazır.</div></article>';
}
function render(){
 const groups=new Map();A.forEach((x,i)=>{if(!groups.has(x.section))groups.set(x.section,[]);groups.get(x.section).push({x,i})});
 $("#sections").innerHTML=[...groups].map(([section,items])=>'<section class="section"><div class="section-head"><div><div class="section-kicker">SITE BÖLÜMÜ</div><h2>'+section+'</h2><p class="section-desc">'+items.length+' görsel slotu</p></div></div><div class="grid">'+items.map(o=>card(o.x,o.i)).join("")+'</div></section>').join("");
 A.forEach((x,i)=>{$("#f"+i).onchange=e=>{const f=e.target.files[0];$("#sel"+i).textContent=f?f.name:"Fotoğraf seçilmedi.";if(f){const url=URL.createObjectURL(f);$("#im"+i).src=url;$("#p"+i).classList.add("has");setStatus(i,"Seçildi · Yüklemek için butona bas.","")}}});
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>send(+b.dataset.u));
}
async function status(){
 try{const r=await api("/api/health?ts="+Date.now(),{timeout:5000}),d=await r.json();const e=$("#conn"),dot=$("#dot");
  if(d.githubTokenConfigured&&d.adminAuthConfigured){e.textContent=d.adminAuthenticated?"✓ GitHub + Admin bağlantısı aktif":"✓ GitHub aktif · Admin girişi gerekli";dot.className="dot "+(d.adminAuthenticated?"ok":"");}
  else if(!d.adminAuthConfigured){e.textContent="✕ ADMIN_PASSWORD Cloudflare Worker secret eksik";dot.className="dot bad";}
  else{e.textContent="✕ GitHub token bağlı değil";dot.className="dot bad";}
 }catch(e){$("#conn").textContent="✕ Worker API yanıt vermiyor";$("#dot").className="dot bad"}
}
async function load(){
 A.forEach((x,i)=>{const img=$("#im"+i),u="/assets/images/"+encodeURIComponent(x.file)+"?v="+Date.now();img.src=u;img.onload=()=>{$("#p"+i).classList.add("has");setStatus(i,"Mevcut görsel gösteriliyor.","ok")};img.onerror=()=>{setStatus(i,"Görsel bulunamadı.","bad");$("#p"+i).classList.remove("has")}});
}
async function send(i){
 const f=$("#f"+i).files[0];if(!f){setStatus(i,"Önce fotoğraf seç.","bad");return}
 if(f.size>12*1024*1024){setStatus(i,"Dosya 12 MB sınırını aşıyor.","bad");return}
 const slot=A[i],cardEl=document.querySelector('[data-card="'+i+'"]');setStatus(i,"Yükleniyor… GitHub'a gönderiliyor.","busy");cardEl?.classList.add("busy");
 const d=new FormData();d.append("file",f);d.append("path",slot.file);
 try{const r=await api("/api/upload",{method:"POST",body:d,timeout:30000}),x=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(x.error||"Yükleme başarısız.");
  $("#im"+i).src=x.url+"?v="+Date.now();$("#p"+i).classList.add("has");setStatus(i,"✓ Yüklendi.","ok");toast("✓ "+slot.label+" güncellendi.");
 }catch(e){setStatus(i,"✕ "+(e.name==="AbortError"?"Worker zaman aşımı.":e.message),"bad");}
 finally{cardEl?.classList.remove("busy")}
}
render();status();load();
</script></body></html>
